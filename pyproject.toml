[project]
name = "itechno"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "iopenpod",
    "questionary>=2.1.1",
    "rich>=15.0.0",
]

[tool.uv.workspace]
members = [
    "vendor/iOpenPod",
]

[tool.uv.sources]
iopenpod = { workspace = true, editable = true }

[dependency-groups]
build = [
    "pyinstaller>=6.22.3",
]

# iOpenPod is a Qt app and lists PyQt6 as a requirement; only its database engine is used here, never the GUI. Dropping
# it saves ~100 MB per install and avoids platforms PyQt6 has no wheels for (Linux arm64 on older glibc).
[tool.uv]
override-dependencies = ["pyqt6; sys_platform == 'never'"]
